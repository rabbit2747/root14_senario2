<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orion Echo Support</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f9;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #607089;
      --line: #d8dee9;
      --blue: #2457a6;
      --teal: #087c7c;
      --green: #20855d;
      --red: #ba3b3b;
      --amber: #b36b18;
      --shadow: 0 10px 28px rgba(21, 34, 55, .08);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.45;
    }

    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .topbar {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      background: #ffffff;
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      font-weight: 700;
      letter-spacing: 0;
    }

    .mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 7px;
      background: var(--blue);
      color: white;
      font-weight: 800;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 18px;
      color: var(--muted);
      font-size: 14px;
    }

    .avatar {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #e6f3f1;
      color: var(--teal);
      font-weight: 700;
    }

    .layout {
      display: grid;
      grid-template-columns: 236px minmax(0, 1fr);
      min-height: calc(100vh - 64px);
    }

    .sidebar {
      padding: 22px 18px;
      border-right: 1px solid var(--line);
      background: #fbfcfe;
    }

    .side-title {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      margin: 8px 10px;
    }

    .side-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 6px;
      color: #263247;
      font-size: 14px;
    }

    .side-link.active { background: #e9eff8; color: var(--blue); font-weight: 700; }
    .count { color: var(--muted); font-size: 12px; }

    .content {
      padding: 28px;
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
    }

    .page-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    h1, h2, h3, p { margin-top: 0; }
    h1 { font-size: 28px; margin-bottom: 6px; letter-spacing: 0; }
    h2 { font-size: 17px; margin-bottom: 14px; }
    h3 { font-size: 14px; margin-bottom: 8px; }

    .muted { color: var(--muted); }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(300px, .65fr);
      gap: 18px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .panel-pad { padding: 18px; }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
    }

    .pill-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 26px;
      padding: 3px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fbfcff;
      color: #3d4b63;
      font-size: 12px;
      font-weight: 650;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
    }
    .dot.amber { background: var(--amber); }
    .dot.red { background: var(--red); }
    .dot.blue { background: var(--blue); }

    .case-summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      border-bottom: 1px solid var(--line);
    }

    .summary-cell {
      padding: 14px 16px;
      border-right: 1px solid var(--line);
    }
    .summary-cell:last-child { border-right: 0; }
    .label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .value { font-size: 14px; font-weight: 700; }

    textarea {
      display: block;
      width: 100%;
      min-height: 312px;
      resize: vertical;
      padding: 14px;
      border: 1px solid #bac4d4;
      border-radius: 7px;
      color: var(--ink);
      background: #fbfcff;
      font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    button, .button-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 38px;
      padding: 0 14px;
      border: 1px solid #1e4c92;
      border-radius: 7px;
      background: var(--blue);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
    }

    .button-link.secondary, button.secondary {
      background: #fff;
      color: #263247;
      border-color: #bac4d4;
    }

    .split-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 14px;
    }

    .activity {
      display: grid;
      gap: 12px;
    }

    .activity-item {
      display: grid;
      grid-template-columns: 10px 1fr;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid #edf1f6;
    }
    .activity-item:last-child { border-bottom: 0; padding-bottom: 0; }

    .preview-box, pre {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcff;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .notice {
      padding: 12px 14px;
      border: 1px solid #bfd7d5;
      border-radius: 7px;
      background: #eef8f6;
      color: #174f4e;
      font-size: 13px;
      margin-bottom: 14px;
    }

    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .grid { grid-template-columns: 1fr; }
      .case-summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 620px) {
      .topbar { padding: 0 14px; }
      .nav span:not(.avatar) { display: none; }
      .content { padding: 18px 14px; }
      .page-head { display: block; }
      .case-summary { grid-template-columns: 1fr; }
      .summary-cell { border-right: 0; border-bottom: 1px solid var(--line); }
      .summary-cell:last-child { border-bottom: 0; }
      .split-actions { align-items: stretch; flex-direction: column; }
      button, .button-link { width: 100%; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="mark">OE</div>
      <div>
        <div>Orion Echo Support</div>
        <div class="muted" style="font-size:12px;font-weight:600;">Customer Operations Console</div>
      </div>
    </div>
    <nav class="nav" aria-label="Global">
      <span>Cases</span>
      <span>Knowledge</span>
      <span>Runbooks</span>
      <span class="avatar" title="orion-support">OS</span>
    </nav>
  </header>
  <div class="layout">
    <aside class="sidebar">
      <div class="side-title">Queues</div>
      <a class="side-link active" href="/">Priority cases <span class="count">7</span></a>
      <a class="side-link" href="/">Escalations <span class="count">3</span></a>
      <a class="side-link" href="/">Release watch <span class="count">2</span></a>
      <a class="side-link" href="/">Customer drafts <span class="count">14</span></a>
      <div class="side-title" style="margin-top:24px;">Systems</div>
      <a class="side-link" href="/">Case preview</a>
      <a class="side-link" href="/">SLA monitor</a>
      <a class="side-link" href="/">Knowledge sync</a>
    </aside>
    <main class="content">
      {% block body %}{% endblock %}
    </main>
  </div>
</body>
</html>
