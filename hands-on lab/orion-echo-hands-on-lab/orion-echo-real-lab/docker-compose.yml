name: orion-echo-real-lab

x-hardening: &hardening
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 200
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m
  restart: unless-stopped

x-ops-service: &ops-service
  image: orion-echo-real-lab-ops-service:latest
  build: ./ops-service
  networks:
    - internal_net
  user: "10004:10004"
  depends_on:
    seeder:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen(f'http://127.0.0.1:{os.environ[\"SERVICE_PORT\"]}/healthz', timeout=2)"]
    interval: 10s
    timeout: 3s
    retries: 10
  <<: *hardening
  mem_limit: 256m

networks:
  edge_net:
    driver: bridge
  internal_net:
    driver: bridge
    internal: true
  audit_net:
    driver: bridge

services:
  edge-proxy:
    image: nginx:1.27-alpine
    ports:
      - "0.0.0.0:28181:8080"
    volumes:
      - ./edge-proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      support-portal:
        condition: service_healthy
    networks:
      - edge_net
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=16m
      - /var/run:rw,noexec,nosuid,nodev,size=4m
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    <<: *hardening

  support-portal:
    build: ./support-portal
    environment:
      AUDIT_LOG: /var/log/portal/audit.log
    expose:
      - "5000"
    networks:
      - edge_net
      - internal_net
    volumes:
      - ./volumes/portal-data:/var/lab:ro
      - ./volumes/audit-logs/portal:/var/log/portal
    user: "10001:10001"
    depends_on:
      seeder:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
    <<: *hardening
    mem_limit: 256m

  ldap:
    image: osixia/openldap:1.5.0
    environment:
      LDAP_ORGANISATION: Orion Echo Systems
      LDAP_DOMAIN: orion.echo
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PW}
    expose:
      - "389"
    networks:
      - internal_net
    volumes:
      - ./ldap/bootstrap.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/01-bootstrap.ldif:ro
      - ./volumes/ldap-data:/var/lib/ldap
      - ./volumes/ldap-config:/etc/ldap/slapd.d
    command: ["--copy-service"]
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-H", "ldap://127.0.0.1:389", "-D", "cn=admin,dc=orion,dc=echo", "-w", "${LDAP_ADMIN_PW}", "-b", "dc=orion,dc=echo"]
      interval: 15s
      timeout: 5s
      retries: 10

  wiki:
    build: ./wiki
    environment:
      LDAP_URI: ldap://ldap:389
      LDAP_BASE: ou=people,dc=orion,dc=echo
      WIKI_DB: /var/wiki/wiki.db
      AUDIT_LOG: /var/log/wiki/audit.log
    expose:
      - "6000"
    networks:
      - internal_net
    volumes:
      - ./volumes/wiki-data:/var/wiki:ro
      - ./volumes/audit-logs/wiki:/var/log/wiki
    user: "10002:10002"
    depends_on:
      ldap:
        condition: service_healthy
      seeder:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
    <<: *hardening
    mem_limit: 256m

  seeder:
    build: ./seeder
    environment:
      LDAP_ADMIN_PW: ${LDAP_ADMIN_PW}
      OPERATOR_PW: ${OPERATOR_PW}
    networks:
      - internal_net
    volumes:
      - ./volumes/portal-data:/seed/portal
      - ./volumes/wiki-data:/seed/wiki
      - ./volumes/audit-logs:/seed/audit
      - ./volumes/service-state:/seed/state
      - ./wiki/seed_pages.json:/seed/wiki/seed_pages.json:ro
    depends_on:
      ldap:
        condition: service_healthy
    restart: "no"

  ticket-service:
    <<: *ops-service
    environment:
      SERVICE_ROLE: ticket-service
      SERVICE_PORT: "7001"
      AUDIT_LOG: /var/log/ticket-service/audit.log
    expose:
      - "7001"
    volumes:
      - ./volumes/audit-logs/ticket-service:/var/log/ticket-service
      - ./volumes/service-state/ticket-service:/state

  source-repo:
    <<: *ops-service
    environment:
      SERVICE_ROLE: source-repo
      SERVICE_PORT: "7002"
      AUDIT_LOG: /var/log/source-repo/audit.log
      BUILD_TRIGGER_TOKEN: build-trigger-demo-7f3a91
    expose:
      - "7002"
    volumes:
      - ./volumes/audit-logs/source-repo:/var/log/source-repo
      - ./volumes/service-state/source-repo:/state

  build-server:
    <<: *ops-service
    environment:
      SERVICE_ROLE: build-server
      SERVICE_PORT: "7003"
      AUDIT_LOG: /var/log/build-server/audit.log
      BUILD_TRIGGER_TOKEN: build-trigger-demo-7f3a91
    expose:
      - "7003"
    volumes:
      - ./volumes/audit-logs/build-server:/var/log/build-server
      - ./volumes/service-state/build-server:/state

  signing-service:
    <<: *ops-service
    environment:
      SERVICE_ROLE: signing-service
      SERVICE_PORT: "7005"
      AUDIT_LOG: /var/log/signing-service/audit.log
      SIGNING_SECRET: orion-real-lab-signing-secret
    expose:
      - "7005"
    volumes:
      - ./volumes/audit-logs/signing-service:/var/log/signing-service
      - ./volumes/service-state/signing-service:/state

  update-server:
    <<: *ops-service
    environment:
      SERVICE_ROLE: update-server
      SERVICE_PORT: "7004"
      AUDIT_LOG: /var/log/update-server/audit.log
      SIGNING_SECRET: orion-real-lab-signing-secret
    expose:
      - "7004"
    volumes:
      - ./volumes/audit-logs/update-server:/var/log/update-server
      - ./volumes/service-state/update-server:/state

  customer-api:
    <<: *ops-service
    environment:
      SERVICE_ROLE: customer-api
      SERVICE_PORT: "7006"
      AUDIT_LOG: /var/log/customer-api/audit.log
    expose:
      - "7006"
    volumes:
      - ./volumes/audit-logs/customer-api:/var/log/customer-api
      - ./volumes/service-state/customer-api:/state

  customer-app:
    <<: *ops-service
    environment:
      SERVICE_ROLE: customer-app
      SERVICE_PORT: "7007"
      AUDIT_LOG: /var/log/customer-app/audit.log
      UPDATE_SERVER: http://update-server:7004
      CUSTOMER_API: http://customer-api:7006
    expose:
      - "7007"
    volumes:
      - ./volumes/audit-logs/customer-app:/var/log/customer-app
      - ./volumes/service-state/customer-app:/state
    depends_on:
      customer-api:
        condition: service_healthy
      update-server:
        condition: service_healthy

  object-store:
    <<: *ops-service
    environment:
      SERVICE_ROLE: object-store
      SERVICE_PORT: "7008"
      AUDIT_LOG: /var/log/object-store/audit.log
    expose:
      - "7008"
    volumes:
      - ./volumes/audit-logs/object-store:/var/log/object-store
      - ./volumes/service-state/object-store:/state

  dark-web-drop:
    <<: *ops-service
    environment:
      SERVICE_ROLE: dark-web-drop
      SERVICE_PORT: "7009"
      AUDIT_LOG: /var/log/dark-web-drop/audit.log
    expose:
      - "7009"
    volumes:
      - ./volumes/audit-logs/dark-web-drop:/var/log/dark-web-drop
      - ./volumes/service-state/dark-web-drop:/state

  grader:
    build: ./grader
    ports:
      - "127.0.0.1:29100:9000"
    networks:
      - audit_net
    volumes:
      - ./volumes/audit-logs:/logs:ro
      - ./grader/rules.yaml:/app/rules.yaml:ro
    user: "10003:10003"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
    <<: *hardening
