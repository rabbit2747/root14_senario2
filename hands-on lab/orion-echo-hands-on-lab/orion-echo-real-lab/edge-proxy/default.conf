server {
    listen 8080;
    server_name _;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    location / {
        proxy_pass http://support-portal:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
