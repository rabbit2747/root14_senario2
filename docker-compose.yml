name: orion-echo-demo

services:
  edge-proxy:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./infra/edge-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - public-site
      - public-docs
      - support-portal
      - vendor-portal
    networks:
      public_net:
      dmz_net:
        aliases:
          - portal.orionecho.test
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  public-site:
    build: ./services/orion-demo
    environment:
      SERVICE_NAME: public-site
    networks:
      dmz_net:
        aliases:
          - www.orionecho.test
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

  public-docs:
    build: ./services/orion-demo
    environment:
      SERVICE_NAME: public-docs
    networks:
      dmz_net:
        aliases:
          - docs.orionecho.test
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

  support-portal:
    build: ./services/orion-demo
    environment:
      SERVICE_NAME: support-portal
      C2_URL: http://c2-emulator:8000
      AUDIT_URL: http://audit-log:8000
    networks:
      dmz_net:
        aliases:
          - support.orionecho.test
      corp_net:
