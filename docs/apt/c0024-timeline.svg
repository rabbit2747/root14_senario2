<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="-apple-system,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <pattern id="grid" width="80" height="20" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- 헤더 -->
  <text x="40" y="40" font-size="22" font-weight="800" fill="#e2e8f0">C0024 · 서울 OO은행 — 새벽 3시</text>
  <text x="40" y="62" font-size="13" fill="#64748b">75s · 12 cues · 2 choice points · 1 video insert</text>

  <!-- 시간축 (40~1240, 75초) -->
  <g transform="translate(40,90)">
    <rect width="1200" height="600" fill="url(#grid)"/>

    <!-- 시간 눈금: 1200px / 75s = 16px/s -->
    <g font-size="10" fill="#475569">
      <line x1="0" y1="0" x2="1200" y2="0" stroke="#334155"/>
      <line x1="0" y1="595" x2="1200" y2="595" stroke="#334155"/>
      <g>
        <line x1="0"    y1="0" x2="0"    y2="600" stroke="#334155" stroke-dasharray="2,3"/>
        <text x="2" y="-4">0s</text>
        <line x1="160"  y1="0" x2="160"  y2="600" stroke="#334155" stroke-dasharray="2,3"/>
        <text x="162" y="-4">10s</text>
        <line x1="320"  y1="0" x2="320"  y2="600" stroke="#334155" stroke-dasharray="2,3"/>
        <text x="322" y="-4">20s</text>
        <line x1="480"  y1="0" x2="480"  y2="600" stroke="#334155" stroke-dasharray="2,3"/>
        <text x="482" y="-4">30s</text>
        <line x1="640"  y1="0" x2="640"  y2="600" stroke="#334155" stroke-dasharray="2,3"/>
        <text x="642" y="-4">40s</text>
        <line x1="800"  y1="0" x2="800"  y2="600" stroke="#334155" stroke-dasharray="2,3"/>
        <text x="802" y="-4">50s</text>
        <line x1="960"  y1="0" x2="960"  y2="600" stroke="#334155" stroke-dasharray="2,3"/>
        <text x="962" y="-4">60s</text>
        <line x1="1120" y1="0" x2="1120" y2="600" stroke="#334155" stroke-dasharray="2,3"/>
        <text x="1122" y="-4">70s</text>
      </g>
    </g>

    <!-- 레인 라벨 -->
    <g font-size="11" font-weight="700" fill="#94a3b8">
      <text x="-32" y="50">CAM</text>
      <text x="-32" y="125">HOT</text>
      <text x="-32" y="180">VID</text>
      <text x="-32" y="250">CHOICE</text>
      <text x="-32" y="380">자막</text>
      <text x="-32" y="510">단계</text>
    </g>

    <!-- 카메라 레인 (y=20~80) -->
    <g>
      <!-- t=0~4 wide_outside -->
      <rect x="0" y="20" width="64" height="50" fill="#1e40af" rx="4"/>
      <text x="6" y="40" font-size="11" font-weight="700" fill="#dbeafe">wide_outside</text>
      <text x="6" y="56" font-size="9" fill="#bfdbfe">35° · 4s</text>

      <!-- t=4~9 dolly_lobby -->
      <rect x="64" y="20" width="80" height="50" fill="#1d4ed8" rx="4"/>
      <text x="70" y="40" font-size="11" font-weight="700" fill="#dbeafe">dolly_lobby</text>
      <text x="70" y="56" font-size="9" fill="#bfdbfe">32° · 5s</text>

      <!-- t=9~15 zoom_admin_pc -->
      <rect x="144" y="20" width="96" height="50" fill="#7c3aed" rx="4"/>
      <text x="150" y="40" font-size="11" font-weight="700" fill="#ede9fe">zoom_admin_pc</text>
      <text x="150" y="56" font-size="9" fill="#ddd6fe">24° · 6s · shake</text>

      <!-- t=15~19 video insert (전체 화면 인서트) -->
      <rect x="240" y="20" width="64" height="50" fill="#dc2626" rx="4" opacity="0.4"/>
      <text x="246" y="44" font-size="10" fill="#fecaca">CCTV cut</text>

      <!-- t=19~24 tilt_corridor -->
      <rect x="304" y="20" width="80" height="50" fill="#0891b2" rx="4"/>
      <text x="310" y="40" font-size="11" font-weight="700" fill="#cffafe">tilt_corridor</text>
      <text x="310" y="56" font-size="9" fill="#a5f3fc">30° · 5s</text>

      <!-- t=24~32 choice block (camera holds) -->
      <rect x="384" y="20" width="128" height="50" fill="#374151" rx="4" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4,2"/>
      <text x="390" y="44" font-size="10" fill="#fef3c7">↓ 분기 #1 hold</text>

      <!-- t=32~38 dolly_server -->
      <rect x="512" y="20" width="96" height="50" fill="#0e7490" rx="4"/>
      <text x="518" y="40" font-size="11" font-weight="700" fill="#cffafe">dolly_server</text>
      <text x="518" y="56" font-size="9" fill="#a5f3fc">28° · 6s</text>

      <!-- t=38~44 close_rack -->
      <rect x="608" y="20" width="96" height="50" fill="#0369a1" rx="4"/>
      <text x="614" y="40" font-size="11" font-weight="700" fill="#dbeafe">close_rack</text>
      <text x="614" y="56" font-size="9" fill="#bfdbfe">22° · 6s · shake</text>

      <!-- t=44~52 choice block #2 -->
      <rect x="704" y="20" width="128" height="50" fill="#374151" rx="4" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4,2"/>
      <text x="710" y="44" font-size="10" fill="#fef3c7">↓ 분기 #2 hold</text>

      <!-- t=52~60 wide_darkweb -->
      <rect x="832" y="20" width="128" height="50" fill="#581c87" rx="4"/>
      <text x="838" y="40" font-size="11" font-weight="700" fill="#f3e8ff">wide_darkweb</text>
      <text x="838" y="56" font-size="9" fill="#e9d5ff">38° · 8s</text>

      <!-- t=60~70 pull_back_wide -->
      <rect x="960" y="20" width="160" height="50" fill="#3730a3" rx="4"/>
      <text x="966" y="40" font-size="11" font-weight="700" fill="#e0e7ff">pull_back_wide</text>
      <text x="966" y="56" font-size="9" fill="#c7d2fe">40° · 10s</text>

      <!-- t=70~75 fade_out -->
      <rect x="1120" y="20" width="80" height="50" fill="#1e1b4b" rx="4"/>
      <text x="1126" y="40" font-size="10" font-weight="700" fill="#a5b4fc">fade_out</text>
      <text x="1126" y="56" font-size="9" fill="#818cf8">→ black</text>
    </g>

    <!-- 핫스팟 레인 (y=100~140) -->
    <g>
      <circle cx="320" cy="120" r="10" fill="#f59e0b"/>
      <text x="335" y="124" font-size="11" fill="#fde68a">h1_traffic — 비정상 IP</text>
      <circle cx="640" cy="120" r="10" fill="#f59e0b"/>
      <text x="655" y="124" font-size="11" fill="#fde68a">h2_lateral — 코어DB 4홉</text>
    </g>

    <!-- 영상 인서트 레인 (y=160~200) -->
    <g>
      <rect x="240" y="160" width="64" height="40" fill="#991b1b" rx="4"/>
      <text x="246" y="180" font-size="10" font-weight="700" fill="#fecaca">CCTV CH-04</text>
      <text x="246" y="194" font-size="9" fill="#fca5a5">Runway 4s</text>
    </g>

    <!-- 분기 레인 (y=220~340) -->
    <g>
      <!-- 분기 1 -->
      <rect x="384" y="220" width="128" height="120" fill="#451a03" rx="6" stroke="#f59e0b" stroke-width="1"/>
      <text x="390" y="238" font-size="11" font-weight="700" fill="#fbbf24">CHOICE #1 (8s)</text>
      <text x="390" y="252" font-size="9" fill="#fcd34d">관리자 PC가 잠겨있지 않다</text>
      <text x="390" y="270" font-size="9" fill="#86efac">A) 즉시 활용 — T1078</text>
      <text x="390" y="284" font-size="9" fill="#86efac">B) 로그 우회 — T1562</text>
      <text x="390" y="298" font-size="9" fill="#86efac">C) 관찰만 — T1583</text>
      <text x="390" y="318" font-size="9" fill="#fb923c" font-style="italic">→ 다이어트: A·B 2개로</text>

      <!-- 분기 2 -->
      <rect x="704" y="220" width="128" height="120" fill="#451a03" rx="6" stroke="#f59e0b" stroke-width="1"/>
      <text x="710" y="238" font-size="11" font-weight="700" fill="#fbbf24">CHOICE #2 (8s)</text>
      <text x="710" y="252" font-size="9" fill="#fcd34d">코어 서버 직전</text>
      <text x="710" y="270" font-size="9" fill="#86efac">A) 외부 유출 — T1041</text>
      <text x="710" y="284" font-size="9" fill="#86efac">B) 랜섬 전환 — T1486</text>
      <text x="710" y="298" font-size="9" fill="#86efac">C) 흔적 삭제 — T1070</text>
      <text x="710" y="318" font-size="9" fill="#fb923c" font-style="italic">→ 다이어트: A·B 2개로</text>
    </g>

    <!-- 자막 레인 (y=360~440) -->
    <g font-size="10" fill="#cbd5e1">
      <text x="0" y="380">23:47</text>
      <text x="64" y="380">교대 5분 공백</text>
      <text x="144" y="380">외주 ID로 로그인된 관리자 PC</text>
      <text x="304" y="380">방화벽 외부 IP 감지</text>
      <text x="512" y="380">권한 획득. 다음은 시간이다</text>
      <text x="608" y="380">코어까지 4홉</text>
      <text x="832" y="380">그 시각, 다크웹 포럼</text>
      <text x="960" y="380">17일 후 외부에 알려졌다</text>
      <text x="1120" y="380" fill="#fbbf24">ATT&amp;CK 요약</text>
    </g>

    <!-- 단계 레인 (y=470~540) -->
    <g font-size="10">
      <rect x="0" y="480" width="240" height="30" fill="#0c4a6e" rx="4"/>
      <text x="6" y="500" fill="#e0f2fe" font-weight="700">ACT 1: 침입</text>

      <rect x="240" y="480" width="272" height="30" fill="#7c2d12" rx="4"/>
      <text x="246" y="500" fill="#ffedd5" font-weight="700">ACT 2: 권한 상승</text>

      <rect x="512" y="480" width="320" height="30" fill="#581c87" rx="4"/>
      <text x="518" y="500" fill="#f3e8ff" font-weight="700">ACT 3: 측면 이동·결정</text>

      <rect x="832" y="480" width="368" height="30" fill="#1e1b4b" rx="4"/>
      <text x="838" y="500" fill="#e0e7ff" font-weight="700">ACT 4: 결과·여운</text>
    </g>

  </g>
</svg>
