  <text x="1015" y="205" text-anchor="middle" fill="#cbd5e1" font-size="11">edu-page / graphic / i18n 가이드</text>
  <text x="1015" y="220" text-anchor="middle" fill="#94a3b8" font-size="10">파일 구조, 네이밍, export 규칙</text>

