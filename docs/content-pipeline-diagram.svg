  <text x="1270" y="185" text-anchor="middle" fill="#94a3b8" font-size="11">/admin (8 tabs)</text>
  <text x="1270" y="205" text-anchor="middle" fill="#cbd5e1" font-size="11">edu-meta, matrix, lab CRUD</text>
