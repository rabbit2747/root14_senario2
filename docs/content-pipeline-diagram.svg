  <line x1="175" y1="230" x2="175" y2="290" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="455" y1="230" x2="455" y2="290" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
