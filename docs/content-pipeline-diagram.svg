  <text x="700" y="78" text-anchor="middle" fill="#94a3b8" font-size="14">MITRE ATT&amp;CK 기반 사이버보안 교육 콘텐츠 생성 파이프라인 (2026-04)</text>

  <!-- ═══════════ ROW 1: SOURCE LAYER ═══════════ -->
  <text x="50" y="125" fill="#64748b" font-size="12" font-weight="600" letter-spacing="2">SOURCE LAYER</text>

  <!-- MITRE ATT&CK -->
