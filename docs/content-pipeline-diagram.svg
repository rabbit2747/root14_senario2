  <text x="340" y="319" text-anchor="end" fill="#3b82f6" font-size="12">203 files</text>

  <text x="70" y="356" fill="#e2e8f0" font-size="12" font-weight="600">public/edu/*.html</text>
  <text x="70" y="376" fill="#94a3b8" font-size="11">t1566-001-beginner-ch1.html</text>
  <text x="70" y="396" fill="#94a3b8" font-size="11">- 10~15 챕터 (개념 → 실습 → 퀴즈)</text>
