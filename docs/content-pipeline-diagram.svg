  <text x="455" y="185" text-anchor="middle" fill="#94a3b8" font-size="11">CVE DB / CISA / 뉴스 보도</text>
  <text x="455" y="205" text-anchor="middle" fill="#cbd5e1" font-size="11">SolarWinds, Log4Shell, MOVEit...</text>
  <text x="455" y="220" text-anchor="middle" fill="#94a3b8" font-size="10">공격 벡터, 영향, 타임라인, 교훈</text>

